name: Zig fmt check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  zig-fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Zig fmt check
        run: |
          zig fmt --check .
